name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rex
    steps:
      # tests/hints.rs scans `../axkit/src`: check both out side by side.
      - uses: actions/checkout@v4
        with:
          path: rex
      - uses: actions/checkout@v4
        with:
          repository: VibRev/axkit
          path: axkit
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
