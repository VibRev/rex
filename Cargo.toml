[package]
name = "rex"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "What idax and bnx share: commands, sessions, exec rendering, addresses, analysis state"
license = "Apache-2.0"
repository = "https://github.com/VibRev/rex"
keywords = ["reverse-engineering", "cli", "agent", "ida", "binary-ninja"]
categories = ["command-line-utilities"]

[dependencies]
axkit = { path = "../axkit" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[lints.clippy]
unwrap_used = "warn"
cast_possible_truncation = "warn"
needless_pass_by_value = "warn"
fn_params_excessive_bools = "warn"
undocumented_unsafe_blocks = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
wildcard_imports = "warn"
return_self_not_must_use = "warn"

[dev-dependencies]
tempfile = "3.27.0"
